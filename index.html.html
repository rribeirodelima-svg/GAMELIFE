<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score 100 - 2026</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { text-align: center; margin-top: 0; }
        
        /* Progress Bar */
        .progress-box { text-align: center; margin-bottom: 20px; }
        .progress-bg { background: #eee; border-radius: 20px; height: 30px; overflow: hidden; position: relative; }
        #progress-bar { background: var(--accent); height: 100%; width: 0%; transition: 0.5s; }
        #score-text { position: absolute; width: 100%; top: 5px; font-weight: bold; }

        /* Tasks */
        .task-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .task-info { flex-grow: 1; margin-right: 10px; }
        input[type="number"] { width: 50px; padding: 5px; border-radius: 4px; border: 1px solid #ddd; }
        
        /* Form Adicionar */
        .add-task-form { display: grid; gap: 10px; margin-top: 15px; border-top: 2px solid #eee; padding-top: 15px; }
        .btn { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; }
        .btn-history { background: #95a5a6; color: white; width: 100%; margin-top: 10px; }

        /* History Modal */
        #history-view { display: none; background: white; position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto; padding: 20px; z-index: 100; }
        .history-day { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 id="display-date">21/03/2026</h2>
        <div class="progress-box">
            <div class="progress-bg">
                <div id="progress-bar"></div>
                <div id="score-text">0 / 100</div>
            </div>
        </div>

        <div id="tasks-list"></div>

        <button class="btn btn-history" onclick="toggleHistory()">📅 Ver Histórico 2026</button>
    </div>

    <div class="card">
        <h3>➕ Nova Tarefa</h3>
        <div class="add-task-form">
            <input type="text" id="new-task-name" placeholder="Ex: Beber 2L de água">
            <input type="number" id="new-task-points" placeholder="Pontos">
            <select id="new-task-type">
                <option value="check">Check (Sim/Não)</option>
                <option value="count">Contador (Acumulativo)</option>
            </select>
            <button class="btn btn-add" onclick="addNewTask()">Adicionar à Lista</button>
        </div>
    </div>
</div>

<div id="history-view">
    <h2>Histórico 2026</h2>
    <div id="history-content"></div>
    <button class="btn btn-add" style="margin-top: 20px;" onclick="toggleHistory()">Voltar</button>
</div>

<script>
    const START_DATE = "2026-03-21";
    let tasks = JSON.parse(localStorage.getItem('tasks_2026')) || [
        { id: 1, name: "🧘 Meditar 10 min", points: 15, type: "check" },
        { id: 2, name: "🧠 Exercício Cérebro", points: 15, type: "check" },
        { id: 3, name: "💪 30 min Exercício", points: 20, type: "check" },
        { id: 4, name: "💼 Trabalho Focado", points: 30, type: "check" },
        { id: 5, name: "❤️ Gentileza Família", points: 10, type: "check" },
        { id: 6, name: "📖 Página de Livro", points: 5, type: "count" },
        { id: 7, name: "🎧 Audiobook (5min)", points: 5, type: "count" },
        { id: 8, name: "📚 Hora de Estudo", points: 20, type: "count" },
        { id: 9, name: "🌍 Estudar Outra Língua", points: 10, type: "check" },
        { id: 10, name: "🎓 Capítulos/Fases Curso", points: 20, type: "count" },
        { id: 11, name: "🎵 Música com Presença", points: 10, type: "check" },
        { id: 12, name: "🏠 Tarefa Reforma", points: 10, type: "check" }
    ];

    let history = JSON.parse(localStorage.getItem('history_2026')) || {};

    function getToday() {
        return new Date().toISOString().split('T')[0];
    }

    function renderTasks() {
        const list = document.getElementById('tasks-list');
        list.innerHTML = '';
        const today = getToday();
        const todayData = history[today] || { scores: {} };

        tasks.forEach(task => {
            const val = todayData.scores[task.id] || 0;
            const html = `
                <div class="task-item">
                    <div class="task-info">
                        <strong>${task.name}</strong> <br>
                        <small>${task.points} pts ${task.type === 'count' ? 'p/ un.' : ''}</small>
                    </div>
                    ${task.type === 'check' 
                        ? `<input type="checkbox" ${val > 0 ? 'checked' : ''} onchange="updateScore(${task.id}, this.checked ? ${task.points} : 0)">`
                        : `<input type="number" min="0" value="${val/task.points}" oninput="updateScore(${task.id}, this.value * ${task.points})">`
                    }
                </div>`;
            list.insertAdjacentHTML('beforeend', html);
        });
        calculateTotal();
    }

    function updateScore(taskId, points) {
        const today = getToday();
        if (!history[today]) history[today] = { total: 0, scores: {} };
        
        history[today].scores[taskId] = points;
        calculateTotal();
        localStorage.setItem('history_2026', JSON.stringify(history));
    }

    function calculateTotal() {
        const today = getToday();
        if (!history[today]) return;

        let total = 0;
        for (let id in history[today].scores) {
            total += history[today].scores[id];
        }
        history[today].total = total;
        
        document.getElementById('score-text').innerText = `${total} / 100`;
        const percent = Math.min((total / 100) * 100, 100);
        const bar = document.getElementById('progress-bar');
        bar.style.width = percent + "%";
        bar.style.background = total >= 100 ? "#FFD700" : "#27ae60";
    }

    function addNewTask() {
        const name = document.getElementById('new-task-name').value;
        const pts = parseInt(document.getElementById('new-task-points').value);
        const type = document.getElementById('new-task-type').value;

        if (name && pts) {
            tasks.push({ id: Date.now(), name: name, points: pts, type: type });
            localStorage.setItem('tasks_2026', JSON.stringify(tasks));
            renderTasks();
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-points').value = '';
        }
    }

    function toggleHistory() {
        const view = document.getElementById('history-view');
        if (view.style.display === 'block') {
            view.style.display = 'none';
        } else {
            view.style.display = 'block';
            const content = document.getElementById('history-content');
            content.innerHTML = '';
            
            // Ordena datas do histórico
            Object.keys(history).sort().reverse().forEach(date => {
                const formattedDate = date.split('-').reverse().join('/');
                content.insertAdjacentHTML('beforeend', `
                    <div class="history-day">
                        <span>${formattedDate}</span>
                        <strong>${history[date].total} pts</strong>
                    </div>
                `);
            });
        }
    }

    // Inicialização
    document.getElementById('display-date').innerText = new Date().toLocaleDateString('pt-BR');
    renderTasks();
</script>

</body>
</html>
